spring.application.name=transfer
fraud.base-url=${FRAUD_BASE_URL:http://localhost:8081}
fraud.connect-timeout=1s
fraud.read-timeout=3s
spring.datasource.url=jdbc:postgresql://localhost:5433/transfer
spring.datasource.username=transfer
spring.datasource.password=${TRANSFER_DB_PASSWORD:transfer_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

#KAFKA
notification.topic=${NOTIFICATION_TOPIC:transfer.notifications}
notification.publisher.enabled=${NOTIFICATION_PUBLISHER_ENABLED:false}
notification.publisher.fixed-delay=1s
notification.publisher.initial-delay=5s
notification.publisher.batch-size=100
notification.publisher.send-timeout=10s
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.properties.linger.ms=0

#CLEARING (simulated)
clearing.simulator.mode=${CLEARING_SIMULATOR_MODE:ACCEPT}
clearing.outcomes.enabled=${CLEARING_OUTCOMES_ENABLED:false}
clearing.outcomes.fixed-delay=2s
clearing.outcomes.initial-delay=5s
# Never set stale-after close to zero in production: a query that precedes the submit means refund plus a later accept
clearing.reconcile.stale-after=5m
clearing.reconcile.fixed-delay=30s
clearing.reconcile.initial-delay=10s
clearing.reconcile.batch-size=50

#ROUTING
transfer.bank-code=${TRANSFER_BANK_CODE:05428}

#DEMO DATA
transfer.demo-data.enabled=${TRANSFER_DEMO_DATA_ENABLED:true}

#METRICS
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}

#OUTBOX METRICS
transfer.metrics.outbox.enabled=${TRANSFER_OUTBOX_METRICS_ENABLED:true}
transfer.metrics.outbox.fixed-delay=15s
transfer.metrics.outbox.initial-delay=5s
