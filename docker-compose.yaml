# Infrastruttura: parte sempre (`docker compose up -d`).
# Profili opzionali:
#   apps        transfer e fraud come container
#   monitoring  Prometheus e Grafana (raccolgono le metriche dei container `apps`)
# Tutto insieme: docker compose --profile apps --profile monitoring up -d --build
services:
  transfer-db:
    image: postgres:17
    container_name: transfer-db
    environment:
      POSTGRES_DB: transfer
      POSTGRES_USER: transfer
      POSTGRES_PASSWORD: ${TRANSFER_DB_PASSWORD:-transfer_dev}
    ports:
      - "5433:5432"
    volumes:
      - transfer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfer -d transfer"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      - kafka
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
           --create --if-not-exists --topic ${NOTIFICATION_TOPIC:-transfer.notifications}
    restart: "no"

  mongo:
    image: mongo:8.0
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: notification
      MONGO_INITDB_ROOT_PASSWORD: ${NOTIFICATION_MONGO_PASSWORD:-notification_dev}
    ports:
      - "27018:27017"
    volumes:
      - notification-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  fraud:
    profiles: ["apps"]
    build: ./fraud-service
    container_name: fraud
    ports:
      - "8081:8081"

  transfer:
    profiles: ["apps"]
    build: ./transfer-service
    container_name: transfer
    depends_on:
      transfer-db:
        condition: service_healthy
      fraud:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://transfer-db:5432/transfer
      TRANSFER_DB_PASSWORD: ${TRANSFER_DB_PASSWORD:-transfer_dev}
      FRAUD_BASE_URL: http://fraud:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # Nel container tutto il flusso e acceso (outbox -> Kafka, esiti della stanza). Fuori dal
      # compose (IDE, test) i default di application.properties restano `false`.
      NOTIFICATION_PUBLISHER_ENABLED: ${NOTIFICATION_PUBLISHER_ENABLED:-true}
      CLEARING_OUTCOMES_ENABLED: ${CLEARING_OUTCOMES_ENABLED:-true}
    ports:
      - "8080:8080"

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.0
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_dev}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  transfer-db-data:
  notification-mongo-data:
  prometheus-data:
  grafana-data:
